<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Size Distribution Chart — PlsSize.Me</title>
  <meta name="description" content="See where your measurements fall on the bell curve for each population.">
  <link rel="canonical" href="https://plssize.me/size-chart.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Size Distribution Chart — PlsSize.Me">
  <meta property="og:description" content="See where your measurements fall on the bell curve for each population.">
  <meta property="og:image" content="https://plssize.me/android-chrome-512x512.png">
  <meta name="theme-color" content="#2f80ed">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="android-chrome-192x192.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/boot.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4Q23E9QXZ"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3286392498569665" crossorigin="anonymous"></script>
  <script type="module" src="js/pages/distribution.js"></script>
</head>
<body>
<main>
  <section class="hero">
    <h1>Size distribution</h1>
    <p>Each curve shows how a measurement is spread across men. The shaded area is the share of men smaller than you.</p>
  </section>

  <div class="card">
    <div class="row">
      <div class="field" style="flex:1;min-width:220px">
        <label for="population">Population</label>
        <select id="population"></select>
      </div>
      <div class="segmented" role="radiogroup" aria-label="Units" style="align-self:end">
        <label><input type="radio" name="unit" value="cm"><span>cm</span></label>
        <label><input type="radio" name="unit" value="in"><span>inches</span></label>
      </div>
    </div>
    <p id="source-note" class="muted" style="margin:10px 0 0"></p>
  </div>

  <div id="no-data" class="notice hidden">No measurements yet — you're seeing the population curves only. <a href="index.html">Enter your measurements</a> to see where you fall.</div>
  <div id="charts" class="grid grid-2"></div>
</main>
</body>
</html>
