<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Survey — PlsSize.Me</title>
  <meta name="description" content="Help improve PlsSize.Me by answering a short anonymous survey about measuring and body image.">
  <link rel="canonical" href="https://plssize.me/survey.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Survey — PlsSize.Me">
  <meta property="og:description" content="Help improve PlsSize.Me by answering a short anonymous survey about measuring and body image.">
  <meta property="og:image" content="https://plssize.me/android-chrome-512x512.png">
  <meta name="theme-color" content="#2f80ed">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="android-chrome-192x192.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/boot.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4Q23E9QXZ"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3286392498569665" crossorigin="anonymous"></script>
  <script type="module" src="js/pages/survey.js"></script>
</head>
<body>
<main>
  <section class="hero">
    <h1>Anonymous survey</h1>
    <p>Two minutes, no personal details. Answers help us improve the site and understand how people feel about size.</p>
  </section>

  <form id="survey-form" class="card stack" novalidate>
    <fieldset class="grid grid-2">
      <legend>About you</legend>
      <div class="field">
        <label for="age">Age range</label>
        <select id="age" name="age" required>
          <option value="">Select…</option>
          <option>18–24</option><option>25–34</option><option>35–44</option><option>45–54</option><option>55+</option>
        </select>
      </div>
      <div class="field">
        <label for="region">Region <span class="hint">(optional)</span></label>
        <select id="region" name="region">
          <option value="">Prefer not to say</option>
          <option>North America</option><option>Latin America &amp; Caribbean</option><option>Europe</option>
          <option>Middle East &amp; North Africa</option><option>Sub-Saharan Africa</option><option>South Asia</option>
          <option>East &amp; Southeast Asia</option><option>Oceania</option>
        </select>
      </div>
    </fieldset>

    <fieldset class="grid grid-2">
      <legend>Measuring</legend>
      <div class="field">
        <label for="method">How did you measure length?</label>
        <select id="method" name="method" required>
          <option value="">Select…</option>
          <option value="bone-pressed">Ruler, pressed to the pubic bone</option>
          <option value="non-bone-pressed">Ruler, not pressed</option>
          <option value="tape">Tape measure</option>
          <option value="photo">Photo tool</option>
          <option value="estimate">Estimate / haven't measured</option>
        </select>
      </div>
      <div class="field">
        <label for="include">Include my saved measurements?</label>
        <select id="include" name="include">
          <option value="yes">Yes, attach them</option>
          <option value="no">No</option>
        </select>
        <span class="hint" id="include-hint"></span>
      </div>
    </fieldset>

    <fieldset class="grid grid-2">
      <legend>How you feel</legend>
      <div class="field">
        <label for="satisfaction">How satisfied are you with your size?</label>
        <select id="satisfaction" name="satisfaction" required>
          <option value="">Select…</option>
          <option value="5">Very satisfied</option><option value="4">Satisfied</option><option value="3">Neutral</option>
          <option value="2">Dissatisfied</option><option value="1">Very dissatisfied</option>
        </select>
      </div>
      <div class="field">
        <label for="anxiety">How often do you worry about your size?</label>
        <select id="anxiety" name="anxiety" required>
          <option value="">Select…</option>
          <option value="1">Never</option><option value="2">Rarely</option><option value="3">Sometimes</option>
          <option value="4">Often</option><option value="5">Always</option>
        </select>
      </div>
      <div class="field">
        <label for="expectation">Before using this site, did you think you were…</label>
        <select id="expectation" name="expectation" required>
          <option value="">Select…</option>
          <option value="below">Below average</option><option value="average">About average</option>
          <option value="above">Above average</option><option value="unsure">Not sure</option>
        </select>
      </div>
      <div class="field">
        <label for="partner">Has a partner ever commented negatively on your size?</label>
        <select id="partner" name="partner">
          <option value="">Prefer not to say</option>
          <option value="never">Never</option><option value="once">Once</option><option value="several">More than once</option>
          <option value="na">Not applicable</option>
        </select>
      </div>
    </fieldset>

    <div class="field">
      <label for="feedback">Anything we should add or fix on the site? <span class="hint">(optional, please no personal details)</span></label>
      <textarea id="feedback" name="feedback" maxlength="1000"></textarea>
    </div>

    <div id="survey-error" class="notice bad hidden" role="alert"></div>
    <div class="row">
      <button type="submit" class="btn primary lg">Submit anonymously</button>
      <span class="muted">You can only submit once per device.</span>
    </div>
  </form>

  <div id="survey-done" class="card center hidden">
    <h2>Thank you!</h2>
    <p>Your answers were recorded anonymously.</p>
    <a class="btn primary" href="index.html">Back to the calculator</a>
  </div>
</main>
</body>
</html>
