<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kink Test - PlsSize.Me</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #1a202c;
            color: #f7fafc;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 100%;
            width: 100%;
            padding: 20px;
            background-color: #2d3748;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        h1, h2, .question-text {
            color: #63b3ed;
        }
        .button {
            background-color: #63b3ed;
            color: #000000;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        .button:hover {
            background-color: #4299e1;
            transform: scale(1.05);
        }
        .question-container {
            transition: opacity 0.5s ease-in-out;
        }
        .fade-out {
            opacity: 0;
        }
        .fade-in {
            opacity: 1;
        }
        .option.selected {
            background-color: #63b3ed;
            color: #e7e9ee;
            font-weight: bold;
        }
        .option {
            transition: background-color 0.3s, transform 0.3s;
            background-color: #4a5568;
            color: #f7fafc;
            border-radius: 5px;
            padding: 8px;
            margin-bottom: 5px;
            flex: 1 1 45%;
            text-align: center;
            font-size: 0.85rem;
            min-width: 100px;
        }
        .option:hover {
            transform: scale(1.05);
            background-color: #63b3ed;
        }
        .options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: space-between;
        }
        #results-container {
            background-color: #2d3748;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 100%;
            overflow: hidden;
        }
        #results-list, #additional-metrics-list {
            margin-bottom: 5px;
            font-size: 0.9rem;
            line-height: 1.2;
        }
        .additional-metrics {
            background-color: #3b4252;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-3xl font-bold text-center mb-4 animate__animated animate__fadeInDown">Kink Test</h1>
        <div id="test-selection" class="p-4 rounded-lg shadow-lg mb-4">
            <h2 class="text-xl font-semibold mb-2">Choose Test Version</h2>
            <div class="flex space-x-2">
                <button id="short-test" class="button">Short Version</button>
                <button id="long-test" class="button">Long Version</button>
            </div>
        </div>
        <div id="test-container" class="p-4 rounded-lg shadow-lg" style="display: none;">
            <div class="mb-2 bg-gray-200 rounded-full">
                <div id="progress-bar" class="bg-indigo-500 text-xs font-medium text-white text-center p-0.5 leading-none rounded-full transition-all duration-300 ease-in-out" style="width: 0%">0%</div>
            </div>
            <div id="questions-container" class="mb-4 question-container">
                <!-- Questions will be dynamically inserted here -->
            </div>
            <button id="next-button" class="button" disabled>Next</button>
            <button id="auto-fill-button" class="button bg-gray-500 hover:bg-gray-600 text-white mt-4">Auto Fill</button>
        </div>
        <div id="results-container" class="p-4 rounded-lg shadow-lg mt-4" style="display: none;">
            <h2 class="text-2xl font-semibold mb-4">Results</h2>
            <ul id="results-list" class="space-y-1"></ul>
            <div class="additional-metrics">
                <h2 class="text-xl font-semibold mb-2">Additional Metrics</h2>
                <ul id="additional-metrics-list" class="space-y-1"></ul>
            </div>
        </div>
    </div>
    <script src="scripts/kink-test.js" type="module"></script>
</body>
</html>
